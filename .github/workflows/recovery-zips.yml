name: recovery-zips

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Build recovery packages
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          VERSION="${VERSION#v}" recovery-installer/build.sh
      - name: Verify helper
        run: |
          file dist/rodin-gpt
          readelf -h dist/rodin-gpt | grep -E 'Class:|Machine:|Type:'
          unzip -l dist/RODIN-Super-Expand-20G-v*.zip
          unzip -l dist/RODIN-Super-Restore-11G-v*.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: rodin-repartition-zips
          path: |
            dist/RODIN-Super-Expand-20G-v*.zip
            dist/RODIN-Super-Restore-11G-v*.zip
            dist/SHA256SUMS.txt
      - name: Publish tag as GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/RODIN-Super-Expand-20G-v*.zip \
            dist/RODIN-Super-Restore-11G-v*.zip \
            dist/SHA256SUMS.txt \
            --title "rodin super repartition ${GITHUB_REF_NAME}" \
            --notes-file recovery-installer/RELEASE_NOTES.md
